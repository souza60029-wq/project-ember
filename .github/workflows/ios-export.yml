name: Export iOS

on: push

jobs:
  exportar_ios:
    runs-on: macos-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Baixar o Godot (macOS)
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_macos.universal.zip
          unzip Godot_v4.2.2-stable_macos.universal.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Baixar templates de exportacao
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.2.2.stable
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.2.2.stable/

      - name: Exportar projeto Xcode (sem compilar ainda)
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --verbose --export-debug "iOS" build/ios/project
          ls -la build/ios

      - name: Compilar o projeto Xcode (sem assinatura)
        run: |
          xcodebuild -project build/ios/project.xcodeproj \
            -scheme project \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build/ios/DerivedData \
            build
          echo "=== Procurando o .app gerado ==="
          find build/ios/DerivedData -name "*.app" -maxdepth 6

      - name: Enviar projeto Xcode gerado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: projeto-xcode-ios
          path: build/ios

      - name: Enviar app compilado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-compilado-ios
          path: build/ios/DerivedData/Build/Products/Release-iphoneos