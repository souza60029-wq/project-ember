name: Export Android

on:
  push:
  workflow_dispatch:

jobs:
  exportar_android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar Godot 4.2.2 (Linux)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Baixar export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
          ls "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Criar keystore de debug e configurar o Godot
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.2.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Conferir configuração
        run: |
          cat "$HOME/.config/godot/editor_settings-4.2.tres"
          ls -la "$HOME/.android/debug.keystore"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Exportar APK de debug
        run: |
          mkdir -p build/android
          ./godot --headless --verbose --export-debug "Android" build/android/ProjectEmber.apk
          ls -la build/android

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectEmber-apk
          path: build/android/ProjectEmber.apk
          if-no-files-found: error