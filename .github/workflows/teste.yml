name: Teste Godot

on:
  push:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar Godot 4.2.2 (Linux)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Testes da lógica
        run: timeout 120 ./godot --headless --script teste.gd